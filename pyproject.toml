[project]
name = "salles"
version = "0.1.0"
description = "Réservation de salles de réunion — application fil rouge de la formation Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "pyyaml>=6",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["spec_coverage: couverture de la spécification, mesurée après tous les autres tests"]

# « Fini » se mesure : `pytest --cov` échoue sous 90 % des branches de app/.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

# Complexité cyclomatique maximale par fonction.
[tool.ruff.lint.mccabe]
max-complexity = 8
