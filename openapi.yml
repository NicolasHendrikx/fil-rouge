# Contrat de l'API « Salles ». Toute route est d'abord décrite ici, puis implémentée.
# tests/test_contract.py vérifie que l'application expose exactement ces routes et ces codes.
openapi: 3.1.0
info:
  title: Salles
  version: 0.1.0
  description: Réservation de salles de réunion.

paths:
  /rooms:
    get:
      operationId: list_rooms
      summary: Lister les salles
      responses:
        "200":
          description: Toutes les salles, triées par identifiant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "500":
          $ref: "#/components/responses/RoomsUnavailable"

  /rooms/available:
    get:
      operationId: list_available_rooms
      summary: Lister les salles disponibles un jour donné
      parameters:
        - name: day
          in: query
          required: true
          description: Jour au format AAAA-MM-JJ.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: >-
            Un calendar par salle ayant au moins un quart d'heure libre entre 8 h et 18 h,
            avec ses seuls créneaux libres.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Calendar"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/RoomsUnavailable"

  /rooms/{room_id}/status:
    get:
      operationId: get_room_status
      summary: Connaître l'état d'une salle à un instant donné (écran de porte)
      parameters:
        - name: room_id
          in: path
          required: true
          description: Identifiant de la salle.
          schema:
            type: integer
        - name: at
          in: query
          required: true
          description: Instant observé, AAAA-MM-JJTHH:MM:SS, heure locale sans fuseau.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: >-
            L'état de la salle à l'instant `at`. Une réservation est en cours si
            start <= at < end : à l'instant de sa fin, la salle est libre.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomStatus"
        "404":
          description: 'La salle n''existe pas : {"detail": "room not found"}.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/RoomsUnavailable"

  /bookings:
    post:
      operationId: create_booking
      summary: Réserver une salle pour un créneau
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
      responses:
        "201":
          description: La réservation créée, avec la salle réservée.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: 'La salle n''existe pas : {"detail": "room not found"}.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "409":
          description: >-
            Le créneau chevauche une réservation existante de la même salle :
            {"detail": "slot already booked"}. Des créneaux qui se touchent
            (fin de l'un = début de l'autre) ne se chevauchent pas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/RoomsUnavailable"

  /bookings/{booking_id}:
    delete:
      operationId: delete_booking
      summary: Annuler une réservation
      parameters:
        - name: booking_id
          in: path
          required: true
          description: Identifiant de la réservation.
          schema:
            type: integer
      responses:
        "204":
          description: >-
            La réservation est supprimée ; le créneau redevient libre. Pas de corps de réponse.
        "404":
          description: 'La réservation n''existe pas : {"detail": "booking not found"}.'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/RoomsUnavailable"

components:
  schemas:
    Room:
      type: object
      required: [id, name, capacity]
      properties:
        id: {type: integer}
        name: {type: string}
        capacity: {type: integer}

    Slot:
      type: object
      required: [start, end]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}

    Calendar:
      type: object
      required: [subject, day, granularity_minutes, slots]
      properties:
        subject: {$ref: "#/components/schemas/Room"}
        day: {type: string, format: date}
        granularity_minutes: {type: integer, const: 15}
        slots:
          type: array
          items: {$ref: "#/components/schemas/Slot"}

    BookingRequest:
      type: object
      description: >-
        Créneau demandé. Invalide (422) si `end` n'est pas après `start`, si les deux ne sont
        pas le même jour, s'ils sortent de la journée (8 h – 18 h) ou ne tombent pas sur un
        quart d'heure.
      required: [room_id, organizer, start, end]
      properties:
        room_id: {type: integer}
        organizer: {type: string, minLength: 1}
        start:
          type: string
          format: date-time
          description: Début, AAAA-MM-JJTHH:MM:SS, heure locale sans fuseau.
        end:
          type: string
          format: date-time
          description: Fin, AAAA-MM-JJTHH:MM:SS, heure locale sans fuseau.

    Booking:
      type: object
      required: [id, room, organizer, start, end]
      properties:
        id: {type: integer}
        room: {$ref: "#/components/schemas/Room"}
        organizer: {type: string}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}

    BookingSummary:
      type: object
      description: Réservation telle qu'affichée sur l'écran de porte.
      required: [organizer, start, end]
      properties:
        organizer: {type: string}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}

    RoomStatus:
      type: object
      description: >-
        État d'une salle à un instant donné. Si la salle est occupée, `current` est la
        réservation en cours et `next` vaut null. Si elle est libre, `current` vaut null et
        `next` est la première réservation du même jour qui commence après `at`, ou null.
      required: [room, at, state, current, next]
      properties:
        room: {$ref: "#/components/schemas/Room"}
        at: {type: string, format: date-time}
        state: {type: string, enum: [free, occupied]}
        current:
          oneOf:
            - $ref: "#/components/schemas/BookingSummary"
            - type: "null"
        next:
          oneOf:
            - $ref: "#/components/schemas/BookingSummary"
            - type: "null"

    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail: {type: string}

  responses:
    RoomsUnavailable:
      description: 'La base est inaccessible : {"detail": "rooms unavailable"}.'
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"

    ValidationError:
      description: Paramètre ou corps de requête invalide (validation FastAPI).
